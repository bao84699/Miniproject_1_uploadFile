<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="discript.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Baloo+Thambi+2:wght@400..800&family=Diplomata&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Michroma&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&family=Outfit:wght@100..900&family=WindSong:wght@400;500&display=swap" rel="stylesheet">
    <title>Discript Documents</title>
</head>
<body>
    <div class="header">
        <div class="container">
            <a href="index.html" class="logo">Prism</a>
            <div class="searchbox">
                <img src="Picture of discript/magnify.svg" alt="">
                <input type="text" name="" id="" placeholder="Tìm kiếm ...">
            </div>
            <button>Đăng nhập</button>
        </div>
    </div>
    <h1>Thêm thông tin</h1>
    <div class="wrap">
        <div class="frame1">
            <div class="item1">
                <i data-lucide="file"></i>
                <p id="nameOfFile">TÀI LIỆU VỪA UP LÊN.docx</p>
            </div>
            <a href="upload.html">
                <div class="item2">
                    <i data-lucide="trash-2"></i>
                </div>
            </a>
        </div>
        <div class="line"></div>
        <div class="frame2">
            <div class="item">
                <p>Tên trường:</p>
                <input type="text" name="" id="school" placeholder="Nhập tên trường">
            </div>
            <div class="item">
                <p>Môn học:</p>
                <select id="subject" class="form-select" required>
                    <option value="" disabled selected hidden>Chọn môn học</option>
                </select>
            </div>
            <div class="item">
                <p for="schoolYear">Năm học:</p>
                <select id="schoolYear" class="form-select"></select>
            </div>
            <div class="itemBtn">
                <p>Phân loại: </p>
                <div class="option">
                    <button class="doc-type" id="exam">Đề thi/ kiểm tra</button>
                    <button class="doc-type" id="slide">Giáo trình/ slide</button>
                    <button class="doc-type" id="exercise">Bài tập</button>
                    <button class="doc-type" id="project">Đồ án/ tiểu luận</button>
                </div>
            </div>
            <div class="item">
                <p>Mô tả:</p>
                <input type="text" name="" id="discript" placeholder="Nhập mô tả" class="a">
            </div>
        </div>
        <button id="submit">Gửi</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@23.0.10/build/js/intlTelInput.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="discript.js"></script>
</body>
</html>
